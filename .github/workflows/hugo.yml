# ============================================================================
# 自动构建 + 部署 Hugo 站点到 GitHub Pages
# 触发时机：每次 push 到 main 分支
# ============================================================================
name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:              # 允许手动触发

# 授权 GITHUB_TOKEN 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署任务；新 push 到来时排队但不取消进行中的
concurrency:
  group: pages
  cancel-in-progress: false

# 默认 shell
defaults:
  run:
    shell: bash

jobs:
  # ---- 构建 ----
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.150.0        # 固定版本，避免 Hugo 大版本升级破坏站点
    steps:
      - name: 安装 Hugo CLI (extended)
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: 检出代码（含 PaperMod 主题 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0            # 完整历史，让 Hugo 能读到 .GitInfo

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 构建
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Shanghai
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ---- 部署 ----
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
